<html>
    <head>
        <title>Menggunakan Ordered list</title>
    </head>
    <body>
        <h3> Menggunakan ordered list </h3>
        <hr>
        <h4>ordered list dengan type default</h4>
        <ol>
            <1i>Agung</1i>
            <1i>Mulya</1i>
            <1i>Bernadhed</1i>
        </ol>

        <h4> Unordered list dengan type square</h4>
        <ol type="a">
            <1i>Agung</1i>
            <1i>Mulya</1i>
            <1i>Bernadhed</1i>
        </ol>
    </body>
</html>
